<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Hub — Portfolio & Command Center</title>
    <meta name="description" content="Professional portfolio, future roadmap, task manager and personal dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #0f172a;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // ── Capacitor Mobile Deep-Link Trigger ─────────────────────────────────
      (function() {
        var hash = window.location.hash || '';
        var search = window.location.search || '';
        var tokenStr = (hash.indexOf('access_token') !== -1)
          ? hash.substring(1)
          : ((search.indexOf('access_token') !== -1) ? search.substring(1) : '');

        if (!tokenStr) return;

        // If returned in a standalone mobile custom tab for the APK, ping the app scheme
        var isMobile = /Android/i.test(navigator.userAgent);
        if (isMobile && !window.location.hash.startsWith('#/')) {
          var customSchemeUrl = 'personalhub://callback#' + tokenStr;
          try {
            window.location.href = customSchemeUrl;
          } catch(e) {}
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
